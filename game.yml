# This game's descriptor: what a server runs when it installs this repository's pack.
#
# It travels INSIDE the pack (dot-ci's package.sh --pack keeps it at the root), so a
# server started with `TMC_GAMES=<owner>/<repo>` needs nothing but the content origin:
# `./server install-games` fetches the pack, verifies it, and writes this file to
# content/<repo>/game.yml, where an operator can then edit cvars and player counts.
#
# content_id, version and kind are STAMPED by the installer from the pack it verified --
# the site addresses a pack as <site username>/<repo> and a re-sync publishes 1.2.0+r2,
# neither of which this file can know. What is written here for them is a placeholder.
#
# Paths are relative to the pack's mount point, which is also this repository's root.
# Keep scene, client_scene and module in step with dot-server-deploy/content/g2gfast/game.yml,
# which describes the same game for a deployment that publishes it itself;
# dot-server-deploy's examples/install_descriptor suite fails when the two disagree.

content_id: gamemann/game-g2gfast
version: 0.0.0
kind: pack

name: g2gfast
max_players: 32

scene: scenes/g2g_server.tscn
client_scene: game/g2g.tscn
module: game/g2g_module.gd

cvars:
  # A map id typed at the console that is not in maps: below is fetched as <owner>/<id>
  # (gamemann/surf_mesa) at the origin's latest; the listed ones come at their pinned version.
  sv_map_content_owner: "gamemann"
  sv_airaccelerate: "1000"
  sv_autobunnyhopping: "1"
  sv_enablebunnyhopping: "1"
  sv_gravity: "800"
  sv_allow_thirdperson: "1"
  sv_replay_bot: "1"

# The courses this server offers: every COURSE in g2gfast-maps' maps.json, each published
# as its own pack (gamemann/<map id>). Written without versions; the server's installer
# pins each to the version on the origin when it installs the game, checks it exists, and
# dot-server carries the pinned list (DotGameDescriptor.maps). A map is downloaded when the
# server changes to it, not with the game. Left out on purpose: bhop_eazy, bhop_lego2 and
# buses_from_hell_fixed have no finish (NOT_COURSES), and bhop_arcane_v2 carries a texture
# from private reference content, so the map publisher refuses it.
maps:
  - gamemann/surf_mesa
  - gamemann/surf_beginner2
  - gamemann/surf_kitsune
  - gamemann/surf_aquaflow
  - gamemann/surf_arcade
  - gamemann/surf_interference
  - gamemann/surf_summit
  - gamemann/surf_year3000
  - gamemann/surf_greensway
  - gamemann/surf_life_of_duck
  - gamemann/surf_stonework3
  - gamemann/bhop_ananas
  - gamemann/bhop_aztec
  - gamemann/bhop_badges
  - gamemann/bhop_badges_mini
  - gamemann/bhop_evolve
  - gamemann/bhop_fur
  - gamemann/bhop_fury_2
  - gamemann/bhop_grove
  - gamemann/bhop_interloper
  - gamemann/bhop_mario_fxd
  - gamemann/bhop_monster_jam
  - gamemann/bhop_pandora2_fix
  - gamemann/bhop_pit
  - gamemann/bhop_supernova
  - gamemann/bhop_tesquo_v2
